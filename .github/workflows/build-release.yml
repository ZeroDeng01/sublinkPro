name: Build and Release Multi-Platform

on:
  push:
    tags:
      - 'v*'
    branches-ignore:
      - 'dependabot/**'
    paths-ignore:
      # 文档文件（不包括 skill-sublinkpro，它会被嵌入到二进制文件中）
      - '*.md'
      - 'docs/**'
      # AI 代理配置和私有文档
      - '.agents/**'
      - '.claude/**'
      - '.codex/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - 'CONTRIBUTING.md'
      # 编辑器/IDE 配置
      - '.vscode/**'
      - '.idea/**'
      - '.editorconfig'
      # Git 配置
      - '.gitignore'
      - '.gitattributes'
      # 许可证文件
      - 'LICENSE'
      - 'COPYING'

permissions:
  contents: read

# Serialize attempts for the same preview commit and supersede old dev pushes.
concurrency:
  group: >-
    ${{ github.ref == 'refs/heads/main' && format('preview-{0}', github.sha) ||
        (github.ref == 'refs/heads/dev' && github.run_attempt == '1' && 'dev-release') ||
        format('build-release-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/dev' && github.run_attempt == '1' }}

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          # cache: 'yarn' # Disabled to prevent using system Yarn v1 which conflicts with Corepack Yarn v4

      - name: Enable Corepack
        run: corepack enable

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: |
          cd webs
          echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v6
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('webs/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install frontend dependencies
        run: |
          cd webs
          yarn install --immutable

      - name: Lint frontend
        run: |
          cd webs
          yarn run lint

      - name: Build frontend
        run: |
          cd webs
          yarn run build

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: webs/dist/
          retention-days: 1

  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: true
          cache-dependency-path: go.sum

      - name: Download Go modules
        run: go mod download

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      - name: Run Go tests
        run: go test ./...

  # 使用矩阵策略并发构建不同架构的二进制文件
  build-go-binaries:
    needs: [build-frontend, backend-quality]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # 允许其他架构继续构建，即使某个失败
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output: sublinkPro-linux-amd64
            upx: true
          - goos: linux
            goarch: arm64
            output: sublinkPro-linux-arm64
            upx: true
          - goos: linux
            goarch: arm
            goarm: 7
            output: sublinkPro-linux-armv7
            upx: true
          - goos: linux
            goarch: 386
            output: sublinkPro-linux-x86
            upx: true
          - goos: windows
            goarch: amd64
            output: sublinkPro-windows-amd64.exe
            upx: false
          - goos: windows
            goarch: 386
            output: sublinkPro-windows-x86.exe
            upx: false
          - goos: darwin
            goarch: amd64
            output: sublinkPro-darwin-amd64
            upx: false
          - goos: darwin
            goarch: arm64
            output: sublinkPro-darwin-arm64
            upx: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: true
          cache-dependency-path: go.sum

      - name: Download frontend artifacts
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: static/

      - name: Write version to VERSION file
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
          else
            TAG_NAME=$(git rev-parse --short HEAD)
          fi
          echo "$TAG_NAME" > VERSION
          echo "Written version $TAG_NAME to VERSION file"

      - name: Build Go binary for ${{ matrix.goos }}/${{ matrix.goarch }}
        run: |
          mkdir -p build
          echo "Building ${{ matrix.output }} for ${{ matrix.goos }}/${{ matrix.goarch }}..."
          if [ -n "${{ matrix.goarm }}" ]; then
            export GOARM="${{ matrix.goarm }}"
            echo "Using GOARM=${GOARM}"
          fi
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -tags=prod -ldflags="-s -w" -o build/${{ matrix.output }} .
          echo "Build completed. Binary size:"
          ls -lh build/${{ matrix.output }}

      - name: Compress binary with UPX
        if: matrix.upx
        run: |
          # 安装 UPX
          sudo apt-get update && sudo apt-get install -y upx

          echo "=== Original binary size ==="
          ls -lh build/${{ matrix.output }}

          # 使用最佳压缩率压缩 Linux 二进制文件
          upx --best --lzma build/${{ matrix.output }} || true

          echo "=== Compressed binary size ==="
          ls -lh build/${{ matrix.output }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/${{ matrix.output }}
          retention-days: 1

  # 合并所有架构的二进制文件
  merge-binaries:
    needs: build-go-binaries
    runs-on: ubuntu-latest
    outputs:
      dev_sha: ${{ steps.dev.outputs.sha }}
    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: build/
          merge-multiple: true

      - name: Verify all binaries
        run: |
          echo "=== All binary files ==="
          ls -lh build/

          # 验证所有必需的二进制文件都存在
          REQUIRED_FILES=(
            "sublinkPro-linux-amd64"
            "sublinkPro-linux-arm64"
            "sublinkPro-linux-armv7"
            "sublinkPro-linux-x86"
            "sublinkPro-windows-amd64.exe"
            "sublinkPro-windows-x86.exe"
            "sublinkPro-darwin-amd64"
            "sublinkPro-darwin-arm64"
          )

          MISSING=0
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "build/$file" ]; then
              echo "ERROR: Missing required binary: $file"
              MISSING=1
            else
              echo "OK: $file exists"
            fi
          done

          if [ $MISSING -eq 1 ]; then
            echo "ERROR: Some required binaries are missing!"
            exit 1
          fi

          echo "=== All binaries verified successfully ==="

      - name: Upload merged binaries
        uses: actions/upload-artifact@v7
        with:
          name: go-binaries
          path: build/
          retention-days: 1

      - name: Read the current dev commit before queuing publication
        id: dev
        if: github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEV_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/dev" --jq '.object.sha')
          printf 'sha=%s\n' "$DEV_SHA" >> "$GITHUB_OUTPUT"

  prepare-preview:
    if: github.ref == 'refs/heads/main'
    needs: merge-binaries
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    outputs:
      tag: ${{ steps.preview.outputs.tag }}
      published: ${{ steps.preview.outputs.published }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve preview tag and publication status
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/prepare_preview.py

  release:
    needs: [merge-binaries, prepare-preview, build-docker]
    if: >-
      !cancelled() && needs.merge-binaries.result == 'success' && needs.build-docker.result == 'success' &&
      (github.ref_type == 'tag' || (github.ref == 'refs/heads/main' &&
       needs.prepare-preview.outputs.published == 'false'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download binary artifacts
        uses: actions/download-artifact@v8
        with:
          name: go-binaries
          path: build/

      - name: Generate changelog
        id: changelog
        env:
          PREVIEW_TAG: ${{ needs.prepare-preview.outputs.tag }}
        run: |
          if [[ "$GITHUB_REF" == 'refs/heads/main' ]]; then
            RELEASE_TAG="$PREVIEW_TAG"
            RELEASE_TITLE="$PREVIEW_TAG"
            DATE=${PREVIEW_TAG#preview-}
            DATE=${DATE%%-*}
            RELEASE_DATE="${DATE:0:4}-${DATE:4:2}-${DATE:6:2}"
            {
              echo '## 阶段性预发布 / Preview release'
              printf '\n- 推送日期 / Push date (UTC+8): %s\n' "$RELEASE_DATE"
              printf -- '- 提交 / Commit: [`%s`](%s/%s/commit/%s)\n' "${GITHUB_SHA:0:7}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
              printf -- '- Docker: `zerodeng/sublink-pro:%s`\n' "$PREVIEW_TAG"
              printf -- '- [Actions](%s/%s/actions/runs/%s)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            } > changelog.md
          else
            RELEASE_TAG="$GITHUB_REF_NAME"
            RELEASE_TITLE="Release $RELEASE_TAG"
            PREVIOUS_TAG=$(git describe --tags --match 'v*' --abbrev=0 HEAD~1 2>/dev/null || true)
            if [[ -n "$PREVIOUS_TAG" ]]; then
              printf '## 🚀 更新内容 (%s -> %s)\n\n' "$PREVIOUS_TAG" "$RELEASE_TAG" > changelog.md
              echo '### 📝 提交记录:' >> changelog.md
              git log --pretty=format:'- %s (%h)' "$PREVIOUS_TAG..HEAD" >> changelog.md
            else
              echo '## 🎉 首次发布' > changelog.md
              printf '\n### 📝 所有提交:\n' >> changelog.md
              git log --pretty=format:'- %s (%h)' >> changelog.md
            fi
          fi

          {
            printf 'tag=%s\n' "$RELEASE_TAG"
            printf 'title=%s\n' "$RELEASE_TITLE"
          } >> "$GITHUB_OUTPUT"

          echo "" >> changelog.md
          echo "### 📦 发布文件:" >> changelog.md
          echo "- \`sublinkPro-linux-amd64\` - Linux x64" >> changelog.md
          echo "- \`sublinkPro-linux-arm64\` - Linux ARM64" >> changelog.md
          echo "- \`sublinkPro-linux-armv7\` - Linux ARMv7 (32-bit)" >> changelog.md
          echo "- \`sublinkPro-linux-x86\` - Linux x86 (32-bit)" >> changelog.md
          echo "- \`sublinkPro-windows-amd64.exe\` - Windows x64" >> changelog.md
          echo "- \`sublinkPro-windows-x86.exe\` - Windows x86 (32-bit)" >> changelog.md
          echo "- \`sublinkPro-darwin-amd64\` - macOS x64" >> changelog.md
          echo "- \`sublinkPro-darwin-arm64\` - macOS ARM64 (Apple Silicon)" >> changelog.md

      - name: Create Release
        id: github-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          name: ${{ steps.changelog.outputs.title }}
          target_commitish: ${{ github.sha }}
          body_path: changelog.md
          files: |
            build/sublinkPro-linux-amd64
            build/sublinkPro-linux-arm64
            build/sublinkPro-linux-armv7
            build/sublinkPro-linux-x86
            build/sublinkPro-windows-amd64.exe
            build/sublinkPro-windows-x86.exe
            build/sublinkPro-darwin-amd64
            build/sublinkPro-darwin-arm64
          fail_on_unmatched_files: true
          draft: ${{ github.ref == 'refs/heads/main' }}
          prerelease: ${{ github.ref == 'refs/heads/main' }}
          make_latest: ${{ github.ref == 'refs/heads/main' && 'false' || '' }}

      - name: Publish preview after uploading all assets
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.github-release.outputs.id }}
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            --field draft=false --field prerelease=true --raw-field make_latest=false --jq '.html_url'

  build-docker:
    needs: [build-frontend, merge-binaries, prepare-preview]
    if: >-
      !cancelled() && needs.build-frontend.result == 'success' && needs.merge-binaries.result == 'success' &&
      ((github.ref == 'refs/heads/dev' && needs.merge-binaries.outputs.dev_sha == github.sha) || github.ref_type == 'tag' ||
       (github.ref == 'refs/heads/main' && needs.prepare-preview.result == 'success' &&
        needs.prepare-preview.outputs.published == 'false'))
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.ref == 'refs/heads/dev' && 'docker-dev' || format('docker-{0}', github.run_id) }}
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download frontend artifacts
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: static/

      - name: Download binary artifacts
        uses: actions/download-artifact@v8
        with:
          name: go-binaries
          path: build/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Multi-Arch Docker Image
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_TAG: ${{ needs.prepare-preview.outputs.tag }}
        run: |
          IMAGE=zerodeng/sublink-pro
          case "$GITHUB_REF" in
            refs/heads/dev)
              HEAD_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/dev" --jq '.object.sha')
              if [[ "$HEAD_SHA" != "$GITHUB_SHA" ]]; then
                echo 'A newer dev commit has superseded this build.'
                exit 0
              fi
              TAGS=(-t "$IMAGE:dev")
              ;;
            refs/heads/main)
              TAGS=(-t "$IMAGE:$PREVIEW_TAG")
              ;;
            refs/tags/v*)
              TAGS=(-t "$IMAGE:$GITHUB_REF_NAME" -t "$IMAGE:latest")
              ;;
            *) exit 1 ;;
          esac
          docker buildx build --no-cache --pull --platform linux/amd64,linux/arm64,linux/arm/v7,linux/386 \
            -f Dockerfile.ci --label "org.opencontainers.image.revision=$GITHUB_SHA" "${TAGS[@]}" --push .
