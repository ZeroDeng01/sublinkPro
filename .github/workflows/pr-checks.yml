name: PR Checks

on:
  pull_request:
    branches: [dev]
    types: [opened, reopened, ready_for_review, edited]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  prepare-pr-check:
    name: Prepare PR Check
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.state == 'open' &&
        (github.event.action != 'edited' || github.event.changes.base.ref.from != null)) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        github.event.issue.state == 'open' && startsWith(github.event.comment.body, '/recheck'))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.automatic.outputs.should_run || steps.recheck.outputs.should_run }}
      checkout_repository: ${{ steps.automatic.outputs.checkout_repository || steps.recheck.outputs.checkout_repository }}
      checkout_ref: ${{ steps.automatic.outputs.checkout_ref || steps.recheck.outputs.checkout_ref }}
      awaiting_approval: ${{ steps.recheck.outputs.awaiting_approval }}
    steps:
      - name: Resolve automatic check target
        id: automatic
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ -z "$HEAD_REPOSITORY" || -z "$HEAD_SHA" ]]; then
            echo 'The pull request head is unavailable.'
            exit 1
          fi
          {
            echo 'should_run=true'
            printf 'checkout_repository=%s\ncheckout_ref=%s\n' "$HEAD_REPOSITORY" "$HEAD_SHA"
          } >> "$GITHUB_OUTPUT"
          printf 'Checking PR #%s at `%s`.\n' "$PR_NUMBER" "$HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Check out command handler from the default branch
        if: github.event_name == 'issue_comment'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/scripts/pr_ci.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Authorize recheck and resolve commit
        id: recheck
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/pr_ci.py prepare-recheck

  backend-checks:
    name: Backend Checks
    needs: prepare-pr-check
    if: needs.prepare-pr-check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.go-build.outcome }}
      golangci: ${{ steps.golangci.outcome }}
      gotest: ${{ steps.gotest.outcome }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.prepare-pr-check.outputs.checkout_repository }}
          ref: ${{ needs.prepare-pr-check.outputs.checkout_ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: ${{ github.event_name == 'pull_request' }}
          cache-dependency-path: go.sum

      - name: Download Go modules
        id: go-modules
        run: go mod download

      - name: Compile Go packages
        id: go-build
        run: go build ./...

      - name: Run golangci-lint
        id: golangci
        if: ${{ !cancelled() && steps.go-modules.outcome == 'success' }}
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      - name: Run Go tests
        id: gotest
        if: ${{ !cancelled() && steps.go-modules.outcome == 'success' }}
        run: go test ./...

      - name: Backend check summary
        if: ${{ !cancelled() }}
        env:
          GO_BUILD: ${{ steps.go-build.outcome }}
          GO_LINT: ${{ steps.golangci.outcome }}
          GO_TEST: ${{ steps.gotest.outcome }}
        run: |
          {
            printf '## Backend Checks\n\n| Check | Result |\n| --- | --- |\n'
            printf '| go build ./... | %s |\n' "$GO_BUILD"
            printf '| golangci-lint | %s |\n' "$GO_LINT"
            printf '| go test ./... | %s |\n' "$GO_TEST"
          } >> "$GITHUB_STEP_SUMMARY"

  frontend-checks:
    name: Frontend Checks
    needs: prepare-pr-check
    if: needs.prepare-pr-check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webs
    outputs:
      lint: ${{ steps.frontend-lint.outcome }}
      build: ${{ steps.frontend-build.outcome }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.prepare-pr-check.outputs.checkout_repository }}
          ref: ${{ needs.prepare-pr-check.outputs.checkout_ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - name: Get yarn cache directory path
        if: github.event_name == 'pull_request'
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies
        if: github.event_name == 'pull_request'
        uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('webs/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install frontend dependencies
        id: frontend-dependencies
        run: yarn install --immutable

      - name: Run frontend lint
        id: frontend-lint
        run: yarn run lint

      - name: Build frontend
        id: frontend-build
        if: ${{ !cancelled() && steps.frontend-dependencies.outcome == 'success' }}
        run: yarn run build

      - name: Frontend check summary
        if: ${{ !cancelled() }}
        working-directory: .
        env:
          FRONTEND_LINT: ${{ steps.frontend-lint.outcome }}
          FRONTEND_BUILD: ${{ steps.frontend-build.outcome }}
        run: |
          {
            printf '## Frontend Checks\n\n| Check | Result |\n| --- | --- |\n'
            printf '| yarn run lint | %s |\n' "$FRONTEND_LINT"
            printf '| yarn run build | %s |\n' "$FRONTEND_BUILD"
          } >> "$GITHUB_STEP_SUMMARY"

  documentation-checks:
    name: Documentation Checks
    needs: prepare-pr-check
    if: needs.prepare-pr-check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.docs.outcome }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.prepare-pr-check.outputs.checkout_repository }}
          ref: ${{ needs.prepare-pr-check.outputs.checkout_ref }}
          persist-credentials: false

      - name: Validate documentation
        id: docs
        run: python3 .github/scripts/check_docs.py

  report-recheck:
    name: Post Recheck Result
    needs: [prepare-pr-check, backend-checks, frontend-checks, documentation-checks]
    if: >-
      always() && github.event_name == 'issue_comment' &&
        (needs.prepare-pr-check.outputs.should_run == 'true' || needs.prepare-pr-check.outputs.awaiting_approval == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out reporter from the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/scripts/pr_ci.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Publish recheck report
        env:
          GH_TOKEN: ${{ github.token }}
          AWAITING_APPROVAL: ${{ needs.prepare-pr-check.outputs.awaiting_approval }}
          CHECKED_SHA: ${{ needs.prepare-pr-check.outputs.checkout_ref }}
          BACKEND_RESULT: ${{ needs.backend-checks.result }}
          GO_BUILD: ${{ needs.backend-checks.outputs.build }}
          GO_LINT: ${{ needs.backend-checks.outputs.golangci }}
          GO_TEST: ${{ needs.backend-checks.outputs.gotest }}
          FRONTEND_RESULT: ${{ needs.frontend-checks.result }}
          FRONTEND_LINT: ${{ needs.frontend-checks.outputs.lint }}
          FRONTEND_BUILD: ${{ needs.frontend-checks.outputs.build }}
          DOCS_RESULT: ${{ needs.documentation-checks.result }}
          DOCS_CHECK: ${{ needs.documentation-checks.outputs.docs }}
        run: python3 .github/scripts/pr_ci.py report-recheck
